name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run all tests locally
    runs-on: ubuntu-latest
    outputs:
      report_ready: ${{ steps.check_report.outputs.ready }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MedMock.sln

      - name: Build
        run: dotnet build MedMock.sln --no-restore --configuration Release

      - name: Run unit and integration tests
        run: dotnet test MedMock.sln --no-build --configuration Release --logger trx --results-directory "$RUNNER_TEMP/results"

      - name: Upload unit and integration test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-integration-test-results
          path: ${{ runner.temp }}/results/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Run C# black-box API tests
        if: always()
        run: bash scripts/run-api-tests.sh

      - name: Set up Node.js
        if: always()
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install TypeScript test dependencies
        if: always()
        run: npm install
        working-directory: tests/playwright-ts

      - name: Run TypeScript Playwright API tests
        if: always()
        run: npm test
        working-directory: tests/playwright-ts

      - name: Check for HTML report
        id: check_report
        if: always()
        run: |
          if [ -f tests/playwright-ts/playwright-report/index.html ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-reports
          path: |
            tests/playwright-ts/playwright-report/
            tests/playwright-ts/reports/junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload report for GitHub Pages
        if: always() && steps.check_report.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: tests/playwright-ts/playwright-report

  publish-report:
    name: Publish Playwright HTML report
    needs: test
    if: always() && needs.test.outputs.report_ready == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy report
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Add report link to workflow summary
        env:
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "[Open the Playwright HTML report](${REPORT_URL})" >> "$GITHUB_STEP_SUMMARY"
