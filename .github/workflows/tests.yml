name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run test suites
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run unit and integration tests
        run: dotnet test tests/Med.Tests/Med.Tests.csproj --configuration Release --nologo

      - name: Run black-box API tests
        run: bash scripts/run-api-tests.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TypeScript test dependencies
        run: npm install
        working-directory: tests/playwright-ts

      - name: Run TypeScript Playwright API tests
        run: npm test
        working-directory: tests/playwright-ts

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            tests/playwright-ts/playwright-report/
            tests/playwright-ts/reports/junit.xml
          if-no-files-found: warn
          retention-days: 14
