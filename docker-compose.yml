# A Test-like environment on your own machine:
#   MED_QA_PASSWORD=choose-a-password docker compose up --build
# Then point the tests at it:
#   TARGET_ENV=test MED_API_URL=http://localhost:5080 MED_QA_PASSWORD=choose-a-password npx playwright test
services:
  api:
    build: .
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Test
      Auth__QaPassword: ${MED_QA_PASSWORD:?Set MED_QA_PASSWORD before starting}
      APP_VERSION: ${APP_VERSION:-local-docker}
